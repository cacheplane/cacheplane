name: Publish

on:
  push:
    tags:
      - 'partial-json-v*'
      - 'partial-markdown-v*'

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'
          registry-url: 'https://registry.npmjs.org'

      - run: pnpm install --frozen-lockfile

      # Trusted publishing requires npm CLI 11.5.1+. Node 20's bundled npm
      # is 10.x which doesn't fully implement the OIDC trusted-publishing
      # flow against the npm registry endpoint.
      - name: Upgrade npm CLI to support trusted publishing
        run: npm install -g npm@latest

      - name: Resolve package from tag
        id: pkg
        run: |
          TAG="${GITHUB_REF_NAME}"
          # tag format: <pkg>-v<version>, e.g. partial-json-v0.2.1
          PKG="${TAG%-v*}"
          VERSION="${TAG##*-v}"
          echo "name=$PKG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "dir=packages/$PKG" >> "$GITHUB_OUTPUT"
          echo "Resolved tag $TAG -> dir=packages/$PKG version=$VERSION"

      - name: Verify version matches package.json
        run: |
          PKG_VERSION=$(node -p "require('./${{ steps.pkg.outputs.dir }}/package.json').version")
          if [ "$PKG_VERSION" != "${{ steps.pkg.outputs.version }}" ]; then
            echo "Tag version ${{ steps.pkg.outputs.version }} does not match package.json $PKG_VERSION"
            exit 1
          fi

      - name: Build target package
        run: pnpm --filter "@cacheplane/${{ steps.pkg.outputs.name }}" build

      # Use npm publish (not pnpm publish): the OIDC trusted-publishing
      # token exchange is implemented in npm CLI 11.5.1+, not in pnpm 9.
      - name: Publish to npm with OIDC trusted publishing
        working-directory: ${{ steps.pkg.outputs.dir }}
        run: npm publish --access public --provenance
        env:
          NPM_CONFIG_PROVENANCE: 'true'
