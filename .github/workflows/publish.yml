name: Publish

on:
  push:
    tags:
      - 'json-stream-v*'
      - 'partial-json-v*'
      - 'partial-markdown-v*'

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v6

      # NOTE: intentionally NO `registry-url` here. When set, actions/setup-node
      # writes an .npmrc with `_authToken=${NODE_AUTH_TOKEN}` and exports a
      # non-empty placeholder token. With a token configured, npm uses
      # token-auth and NEVER attempts the OIDC trusted-publishing exchange —
      # the registry then rejects the placeholder with a 404. Omitting
      # registry-url leaves no token configured (npm defaults to
      # registry.npmjs.org), so OIDC trusted publishing engages.
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'pnpm'

      # The OIDC trusted-publishing token exchange is only implemented in npm
      # CLI >= 11.5.1 (Node 24.5.0+). Node 24's bundled npm can be older
      # (11.3.x/11.4.x), so upgrade explicitly.
      - run: npm install -g npm@^11.5.1

      - run: pnpm install --frozen-lockfile

      - name: Resolve package from tag
        id: pkg
        run: |
          TAG="${GITHUB_REF_NAME}"
          # tag format: <pkg>-v<version>, e.g. partial-json-v0.2.1
          PKG="${TAG%-v*}"
          VERSION="${TAG##*-v}"
          {
            echo "name=$PKG"
            echo "version=$VERSION"
            echo "dir=packages/$PKG"
          } >> "$GITHUB_OUTPUT"
          echo "Resolved tag $TAG -> dir=packages/$PKG version=$VERSION"

      - name: Verify version matches package.json
        run: |
          PKG_VERSION=$(node -p "require('./${{ steps.pkg.outputs.dir }}/package.json').version")
          if [ "$PKG_VERSION" != "${{ steps.pkg.outputs.version }}" ]; then
            echo "Tag version ${{ steps.pkg.outputs.version }} does not match package.json $PKG_VERSION"
            exit 1
          fi

      - name: Build target package
        run: |
          pnpm --filter "@cacheplane/${{ steps.pkg.outputs.name }}^..." build
          pnpm --filter "@cacheplane/${{ steps.pkg.outputs.name }}" build

      - name: Pack target package
        id: pack
        working-directory: ${{ steps.pkg.outputs.dir }}
        run: |
          TARBALL="$RUNNER_TEMP/cacheplane-${{ steps.pkg.outputs.name }}-${{ steps.pkg.outputs.version }}.tgz"
          pnpm pack --pack-destination "$RUNNER_TEMP"
          PACKED_MANIFEST=$(tar -xOf "$TARBALL" package/package.json)
          if echo "$PACKED_MANIFEST" | grep -q 'workspace:'; then
            echo "Packed package contains an unresolved workspace dependency"
            exit 1
          fi
          echo "tarball=$TARBALL" >> "$GITHUB_OUTPUT"

      # Use npm publish (not pnpm publish): the OIDC trusted-publishing
      # token exchange is implemented in npm CLI 11.5.1+, not in pnpm 9.
      - name: Publish to npm with OIDC trusted publishing
        run: npm publish "${{ steps.pack.outputs.tarball }}" --access public --provenance --loglevel verbose
        env:
          NPM_CONFIG_PROVENANCE: 'true'
